<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ราคาประตูฟัก/ปีกนก — เปรียบทุกร้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<script>(function(){if(localStorage.getItem('spTheme')!=='dark'){document.documentElement.classList.add('light');}})();</script>
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()">🌙 มืด</button>
<style>
:root{--bg:#FAFAF8;--bg3:#FFF;--bg4:#F2F0EC;--text:#1C1A18;--dim:#5C5850;--green:#1A7A5E;--red:#C0392B;--yellow:#8B6914;--blue:#1A5FAA;--orange:#C04A1A;--purple:#6D4AA8;--border:rgba(0,0,0,.12);}
html:not(.light){--bg:#0A0A0F;--bg3:#18181F;--bg4:#1E1E28;--text:#EEEAF5;--dim:#7A7590;--green:#00E5A0;--red:#FF4060;--yellow:#FFD060;--blue:#60A5FA;--orange:#FF6B35;--purple:#A78BFA;--border:rgba(255,255,255,.07);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:14px;padding:20px 16px 80px;max-width:960px;margin:0 auto;}
#theme-toggle{position:fixed;top:14px;right:16px;z-index:9999;border-radius:20px;padding:7px 15px;font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.15);}
.back{display:inline-flex;gap:6px;color:var(--dim);font-size:12px;text-decoration:none;margin-bottom:16px;}
h1{font-size:19px;font-weight:800;margin-bottom:4px;}
.sub{font-size:12px;color:var(--dim);margin-bottom:14px;}
.insight{background:rgba(192,74,26,.07);border:1px solid rgba(192,74,26,.25);border-radius:11px;padding:12px 15px;font-size:12.5px;line-height:1.85;margin-bottom:14px;}
.insight b{color:var(--orange);}
.note{background:rgba(139,105,20,.08);border:1px solid rgba(139,105,20,.28);border-radius:11px;padding:12px 15px;font-size:12.5px;line-height:1.85;margin-bottom:16px;}
.note b{color:var(--yellow);}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:14px;font-size:12px;}
.leg{display:flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:2px;}
.grp{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin:22px 0 9px;}
.tbl-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow-x:auto;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px;}
th{background:var(--bg4);padding:8px 10px;font-size:10px;font-family:'Space Mono',monospace;font-weight:400;color:var(--dim);text-align:right;white-space:nowrap;}
th:first-child{text-align:left;}
th.us{color:var(--orange);font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-family:'Space Mono',monospace;}
td:first-child{text-align:left;font-family:'Sarabun',sans-serif;font-weight:700;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg4);}
.win{color:var(--green);font-weight:700;}
.lose{color:var(--red);}
.mid{color:var(--text);}
.us-col{color:var(--orange);font-weight:700;}
.na{color:var(--dim);opacity:.32;}
.shopmeta{background:var(--bg3);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:16px;}
.sm-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:9px 13px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center;}
.sm-row:last-child{border-bottom:none;}
.sm-row.h{background:var(--bg4);font-size:10px;font-family:'Space Mono',monospace;color:var(--dim);}
.sm-n{font-weight:600;}
.sm-v{font-family:'Space Mono',monospace;font-weight:700;}
</style>

<a class="back" href="index.html">← กลับหน้าหลัก</a>
<h1>🚪 ราคาประตูฟัก / ปีกนก — เปรียบทุกร้าน</h1>
<p class="sub">5ฟักปีกนก · 8ฟัก · อัปเดต 26 ส.ค. 2569</p>

<div class="insight" id="insight"></div>

<div class="note">
📊 <b>ยอดขายจริงต่อเดือน</b> — ใช้ตัวเลข "ยอดขาย 30 วัน" ระดับ listing เท่านั้น (คอลัมน์ยอดขาย SKU ใน Shopdera ไม่ใช่ยอดต่อเดือน)
</div>

<div class="grp">ยอดขายต่อเดือนของแต่ละ listing</div>
<div class="shopmeta" id="meta"></div>

<div class="legend">
  <div class="leg"><div class="dot" style="background:var(--green)"></div><span style="color:var(--green)">ถูกที่สุดในแถว</span></div>
  <div class="leg"><div class="dot" style="background:var(--red)"></div><span style="color:var(--red)">แพงที่สุดในแถว</span></div>
  <div class="leg"><div class="dot" style="background:var(--orange)"></div><span style="color:var(--orange)">ร้านเรา</span></div>
</div>

<div id="out"></div>

<script>
const SHOPS=[
 {k:'de',   name:'De',           us:true},
 {k:'tb',   name:'Tb',           us:true},
 {k:'chock',name:'chocksomkid'},
 {k:'lam',  name:'LAMTONMAISAK'},
];

const META=[
 {shop:'chocksomkid', listing:'ประตูไม้สักแท้ราคาส่ง (80×200 รวมลาย)', rank:'#110', sold30:1000, gmv:'฿1,350,000'},
 {shop:'chocksomkid', listing:'ประตูไม้สักแท้ราคาส่ง 90×200',           rank:'#2507', sold30:7,   gmv:'฿13,930'},
 {shop:'LAMTONMAISAK',listing:'ประตูไม้สัก ประตูฉลุลาย + วงกบ',          rank:null,    sold30:2,   gmv:'฿1,980'},
];

const D=[
 {lay:'5ฟักปีกนก', z:'80×200', de:{p:2156}, tb:{p:2150}, chock:{p:2350}, lam:{p:2500,note:'ไม่ระบุลาย'}},
 {lay:'5ฟักปีกนก', z:'90×200', de:{p:2890}, tb:null,     chock:{p:2850}, lam:{p:2600,note:'ไม่ระบุลาย'}},
 {lay:'5ฟักปีกนก', z:'70×200', de:null,     tb:null,     chock:null,     lam:{p:2400,note:'ไม่ระบุลาย'}},

 {lay:'8ฟัก', z:'80×200', de:{p:2156}, tb:{p:2150}, chock:{p:2350}, lam:null},
 {lay:'8ฟัก', z:'90×200', de:{p:2890}, tb:null,     chock:{p:2850}, lam:null},
];

function vals(r){return SHOPS.map(s=>r[s.k]).filter(x=>x&&x.p).map(x=>x.p);}
function cell(x,r,us){
  if(!x||!x.p) return '<span class="na">—</span>';
  const ns=vals(r);
  let cls = us ? 'us-col' : 'mid';
  if(!us && ns.length>1){
    if(x.p===Math.min(...ns)) cls='win';
    else if(x.p===Math.max(...ns)) cls='lose';
  }
  const nt = x.note ? '<div style="font-size:9px;color:var(--dim);margin-top:2px">'+x.note+'</div>' : '';
  return '<span class="'+cls+'">฿'+x.p.toLocaleString()+'</span>'+nt;
}
function renderMeta(){
  let h='<div class="sm-row h"><span>Listing</span><span>Ranking</span><span>ขาย/เดือน</span></div>';
  META.forEach(m=>{
    h+='<div class="sm-row"><span><span class="sm-n">'+m.shop+'</span>'
      +'<div style="font-size:11px;color:var(--dim)">'+m.listing+'</div></span>'
      +'<span class="sm-v" style="color:var(--dim)">'+(m.rank||'—')+'</span>'
      +'<span class="sm-v" style="color:'+(m.sold30>=100?'var(--red)':'var(--green)')+'">'+m.sold30.toLocaleString()+'</span></div>';
  });
  document.getElementById('meta').innerHTML=h;
}
function render(){
  const groups={};
  D.forEach(r=>{(groups[r.lay]=groups[r.lay]||[]).push(r);});
  let html='';
  Object.entries(groups).forEach(([lay,rs])=>{
    html+='<div class="grp">'+lay+'</div><div class="tbl-wrap"><table><thead><tr>';
    html+='<th style="text-align:left">ขนาด</th>';
    SHOPS.forEach(s=>{html+='<th'+(s.us?' class="us"':'')+'>'+s.name+'</th>';});
    html+='</tr></thead><tbody>';
    rs.forEach(r=>{
      html+='<tr><td>'+r.z+'</td>';
      SHOPS.forEach(s=>{html+='<td>'+cell(r[s.k],r,!!s.us)+'</td>';});
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('out').innerHTML=html;
}
document.getElementById('insight').innerHTML=
 '✅ <b>80×200 — เราถูกที่สุด</b> · Tb ฿2,150 / De ฿2,156 ถูกกว่า chocksomkid (฿2,350) ราว ฿200<br>'+
 '⚠️ <b>90×200 — chocksomkid ถูกกว่าเรา ฿40</b> (฿2,850 vs De ฿2,890) แต่ listing เขาขายได้แค่ 7 ชิ้น/เดือน<br>'+
 '🔥 <b>chocksomkid listing 80×200 ขาย 1,000 ชิ้น/เดือน</b> (ranking #110) — เป็น listing รวมหลายลาย ไม่ใช่ฟักอย่างเดียว<br>'+
 '💡 <b>LAMTONMAISAK</b> ตั้งราคาสูงสุด (฿2,400-2,600) แต่ขายได้แค่ 2 ชิ้น/เดือน · listing เพิ่งเปิด ก.พ. 69';
function toggleTheme(){const l=document.documentElement.classList.toggle('light');document.getElementById('theme-toggle').textContent=l?'🌙 มืด':'☀️ สว่าง';localStorage.setItem('spTheme',l?'light':'dark');}
document.addEventListener('DOMContentLoaded',function(){const b=document.getElementById('theme-toggle');if(b)b.textContent=document.documentElement.classList.contains('light')?'🌙 มืด':'☀️ สว่าง';});
renderMeta();render();
</script>
</body>
</html>
