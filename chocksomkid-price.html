:root{--bg:#0A0A0F;--bg3:#18181F;--bg4:#1E1E28;--text:#EEEAF5;--dim:#7A7590;--green:#00E5A0;--red:#FF4060;--yellow:#FFD060;--blue:#60A5FA;--orange:#FF6B35;--purple:#A78BFA;--border:rgba(255,255,255,0.07);}

.sum-n{font-size:19px;font-weight:700;font-family:'Space Mono',monospace;}
.sum-l{font-size:11px;color:var(--dim);}
.search-box{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:13px;margin-bottom:14px;}
.search-box:focus{outline:none;border-color:var(--orange);}
.filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.btn{font-size:12px;padding:5px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:var(--bg3);color:var(--dim);cursor:pointer;font-family:'Sarabun',sans-serif;}
.btn.active{background:rgba(96,165,250,.15);color:var(--blue);border-color:rgba(96,165,250,.4);}
.listing{background:var(--bg3);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.lhead{background:var(--bg4);padding:11px 14px;border-bottom:1px solid var(--border);}
.ltitle{font-size:13px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);font-family:'Space Mono',monospace;}
.lmeta b{color:var(--text);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:transparent;padding:7px 14px;font-size:10px;font-family:'Space Mono',monospace;font-weight:400;color:var(--dim);text-align:right;border-bottom:1px solid var(--border);}
th:first-child{text-align:left;}
td{padding:9px 14px;border-bottom:1px solid var(--border);text-align:right;font-family:'Space Mono',monospace;white-space:nowrap;}
td:first-child{text-align:left;font-family:'Sarabun',sans-serif;font-weight:600;white-space:normal;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg4);}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;}
.p-hot{background:rgba(255,64,96,.13);color:var(--red);border:1px solid rgba(255,64,96,.3);}
.p-ok{background:rgba(0,229,160,.12);color:var(--green);border:1px solid rgba(0,229,160,.3);}
.p-cat{background:rgba(167,139,250,.13);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
.share{color:var(--dim);font-size:11px;}
.note{background:rgba(255,208,96,.09);border:1px solid rgba(255,208,96,.3);border-radius:10px;padding:11px 14px;font-size:12px;margin-bottom:16px;line-height:1.7;}
.empty{text-align:center;padding:40px;color:var(--dim);}
html.light{--bg:#FAFAF8;--bg3:#FFF;--bg4:#F2F0EC;--text:#1C1A18;--dim:#5C5850;--green:#1A7A5E;--red:#C0392B;--yellow:#8B6914;--blue:#1A5FAA;--orange:#C04A1A;--purple:#6D4AA8;--border:rgba(0,0,0,.12);}
html.light body{background:#FAFAF8;color:#1C1A18;}
html.light .btn{border-color:rgba(0,0,0,.2);background:#F2F0EC;color:#5C5850;}
html.light .btn.active{background:rgba(26,95,170,.12);color:#1A5FAA;border-color:rgba(26,95,170,.4);}
html.light #theme-toggle{background:#FFF;border-color:rgba(0,0,0,.15);color:#1C1A18;}
html.light .search-box{background:#FFF;border-color:rgba(0,0,0,.15);color:#1C1A18;}
html.light tr:hover td{background:#F7F5F1;}
html.light .note{background:rgba(139,105,20,.07);border-color:rgba(139,105,20,.25);}

let F='all';

function renderSummary(){
  const skus=L.reduce((s,l)=>s+l.items.length,0);
  const all=L.flatMap(l=>l.items.map(i=>i.p));
  const s30=L.reduce((s,l)=>s+(l.meta.sold30||0),0);
  document.getElementById('summary').innerHTML=
   '<div class="sum"><div class="sum-n" style="color:var(--blue)">'+L.length+'</div><div class="sum-l">Listing</div></div>'+
   '<div class="sum"><div class="sum-n" style="color:var(--purple)">'+skus+'</div><div class="sum-l">SKU</div></div>'+
   '<div class="sum"><div class="sum-n" style="color:var(--orange)">'+s30.toLocaleString()+'</div><div class="sum-l">ขาย/เดือน รวม</div></div>'+
   '<div class="sum"><div class="sum-n" style="color:var(--green)">฿'+Math.min(...all)+'</div><div class="sum-l">ต่ำสุด</div></div>'+
   '<div class="sum"><div class="sum-n" style="color:var(--yellow)">฿'+Math.max(...all).toLocaleString()+'</div><div class="sum-l">สูงสุด</div></div>';
}
function renderFilters(){
  let h='<button class="btn active" onclick="setF(\'all\',this)">ทั้งหมด</button>';
  L.forEach(l=>{h+='<button class="btn" onclick="setF(\''+l.id+'\',this)">'+l.cat+'</button>';});
  document.getElementById('filters').innerHTML=h;
}
function metaLine(m){
  let p=[];
  if(m.rank) p.push('Ranking <b>'+m.rank+'</b>');
  if(m.sold30!=null) p.push('ขาย/เดือน <b>'+m.sold30.toLocaleString()+'</b>');
  if(m.soldAll) p.push('ขายรวม <b>'+m.soldAll+'</b>');
  if(m.rev) p.push('รีวิว <b>'+m.rev+'</b> ('+m.star+'★)');
  if(m.gmv) p.push('GMV30 <b>'+m.gmv+'</b>');
  if(m.age) p.push('อายุ <b>'+m.age+'</b>');
  return p.join(' · ');
}
function render(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  let html='';
  L.forEach(l=>{
    if(F!=='all'&&l.id!==F) return;
    let items=l.items;
    if(q){
      const hit=l.title.toLowerCase().includes(q)||l.cat.toLowerCase().includes(q);
      items=hit?items:items.filter(i=>i.n.toLowerCase().includes(q));
      if(!items.length) return;
    }
    html+='<div class="listing"><div class="lhead">'
      +'<div class="ltitle">'+l.title+' <span class="pill p-cat">'+l.cat+'</span></div>'
      +'<div class="lmeta">'+metaLine(l.meta)+'</div></div>'
      +'<table><thead><tr><th style="text-align:left">SKU</th><th>ราคา</th><th>Share</th><th>สต็อก</th><th>ขาย/เดือน</th></tr></thead><tbody>';
    items.forEach(i=>{
      html+='<tr><td>'+i.n+'</td>'
        +'<td><strong>฿'+i.p.toLocaleString()+'</strong></td>'
        +'<td class="share">'+(i.sh||'—')+'</td>'
        +'<td class="share">'+(i.st!=null?i.st.toLocaleString():'—')+'</td>'
        +'<td>'+(i.s30!=null?'<span class="pill '+(i.s30>=50?'p-hot':'p-ok')+'">'+i.s30+'</span>':'—')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('out').innerHTML=html||'<div class="empty">ไม่พบสินค้าที่ค้นหา</div>';
}
function setF(f,btn){F=f;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function toggleTheme(){const l=document.documentElement.classList.toggle('light');document.getElementById('theme-toggle').textContent=l?'🌙 มืด':'☀️ สว่าง';localStorage.setItem('spTheme',l?'light':'dark');}
document.addEventListener('DOMContentLoaded',function(){const b=document.getElementById('theme-toggle');if(b)b.textContent=document.documentElement.classList.contains('light')?'🌙 มืด':'☀️ สว่าง';});
renderSummary();renderFilters();render();
</script>
