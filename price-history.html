<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price History — ประวัติการเปลี่ยนแปลงราคา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0F;--bg2:#111118;--bg3:#18181F;--bg4:#1E1E28;--text:#EEEAF5;--dim:#7A7590;--green:#00E5A0;--red:#FF4060;--yellow:#FFD060;--blue:#60A5FA;--orange:#FF6B35;--purple:#A78BFA;--border:rgba(255,255,255,0.07);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:14px;padding:20px 16px 80px;max-width:900px;margin:0 auto;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;text-decoration:none;margin-bottom:20px;}
  .back:hover{color:var(--text);}
  h1{font-size:18px;font-weight:700;margin-bottom:4px;}
  .sub{font-size:12px;color:var(--dim);margin-bottom:24px;}

  /* ADD FORM */
  .form-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px;}
  .form-title{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--orange);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr 1fr;}}
  .field label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .field input, .field select{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:13px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--orange);}
  .field select option{background:var(--bg4);}
  .btn-add{background:var(--orange);color:white;border:none;border-radius:8px;padding:10px 20px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;}
  .btn-add:hover{opacity:0.9;}

  /* FILTER */
  .filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
  .btn{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:var(--bg3);color:var(--dim);cursor:pointer;font-family:'Sarabun',sans-serif;transition:all 0.15s;}
  .btn.active{background:rgba(96,165,250,0.15);color:var(--blue);border-color:rgba(96,165,250,0.4);}

  /* TIMELINE */
  .timeline-wrap{position:relative;padding-left:20px;}
  .timeline-wrap::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--orange),var(--bg4));border-radius:2px;}

  .entry{position:relative;margin-bottom:16px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .entry::before{content:'';position:absolute;left:-17px;top:18px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg3);}
  .entry.up::before{background:var(--red);}
  .entry.down::before{background:var(--green);}
  .entry.new::before{background:var(--blue);}

  .entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .entry-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .entry-date{font-size:11px;font-family:'Space Mono',monospace;color:var(--dim);}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;}
  .tag-shop-de{background:rgba(255,107,53,0.15);color:var(--orange);border:1px solid rgba(255,107,53,0.3);}
  .tag-shop-tb{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.3);}
  .tag-shop-chock{background:rgba(96,165,250,0.15);color:var(--blue);border:1px solid rgba(96,165,250,0.3);}
  .tag-shop-lam{background:rgba(255,208,96,0.15);color:var(--yellow);border:1px solid rgba(255,208,96,0.3);}
  .tag-shop-other{background:var(--bg4);color:var(--dim);border:1px solid var(--border);}
  .tag-sku{background:var(--bg4);color:var(--text);border:1px solid var(--border);}

  .price-change{display:flex;align-items:center;gap:10px;}
  .price-old{font-size:14px;color:var(--dim);text-decoration:line-through;}
  .arrow{color:var(--dim);font-size:14px;}
  .price-new{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;}
  .price-new.up{color:var(--red);}
  .price-new.down{color:var(--green);}
  .price-new.new{color:var(--blue);}

  .diff-badge{font-size:11px;padding:2px 8px;border-radius:4px;font-family:'Space Mono',monospace;}
  .diff-up{background:rgba(255,64,96,0.15);color:var(--red);}
  .diff-down{background:rgba(0,229,160,0.15);color:var(--green);}
  .diff-new{background:rgba(96,165,250,0.15);color:var(--blue);}

  .entry-note{font-size:12px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}

  .btn-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;}
  .btn-del:hover{color:var(--red);background:rgba(255,64,96,0.1);}

  .empty{text-align:center;padding:40px;color:var(--dim);font-size:13px;}

  .summary-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .sum-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;flex:1;min-width:100px;text-align:center;}
  .sum-num{font-size:20px;font-weight:700;font-family:'Space Mono',monospace;margin-bottom:2px;}
  .sum-label{color:var(--dim);font-size:11px;}

  /* LIGHT MODE */
  body.light {
    --bg:#F8F6F2; --bg2:#FFFFFF; --bg3:#FFFFFF; --bg4:#F0EDE8;
    --text:#1A1614; --dim:#6B6560;
    --green:#1A7A5E; --red:#C0392B; --yellow:#B8860B; --blue:#1A5FAA; --orange:#C0491A;
    --border:rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
<button id="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:12px;right:16px;z-index:999;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;">🌙 มืด</button>

<a class="back" href="index.html">← กลับหน้าหลัก</a>
<h1>📈 Price History</h1>
<p class="sub">บันทึกการเปลี่ยนแปลงราคาทุกร้าน — เรียงตามเวลา</p>

<!-- ADD FORM -->
<div class="form-card">
  <div class="form-title">+ เพิ่มการเปลี่ยนแปลงราคา</div>
  <div class="form-grid">
    <div class="field">
      <label>ร้าน</label>
      <select id="f-shop">
        <option value="de">De (DOOR_E_D)</option>
        <option value="tb">Tb (turbo teak)</option>
        <option value="chock">chocksomkid</option>
        <option value="lam">LAMTONMAISAK</option>
        <option value="mp">ไม้พร้อม</option>
        <option value="ojas">ojas</option>
        <option value="cwd">cwd</option>
        <option value="fh">full house</option>
        <option value="pkd">ประกายดาว</option>
        <option value="other">อื่นๆ</option>
      </select>
    </div>
    <div class="field">
      <label>สินค้า / SKU</label>
      <select id="f-sku">
        <option>สายฝน 80×200</option>
        <option>สายฝน 80×180</option>
        <option>สายฝน 90×200</option>
        <option>สายฝน 70×200</option>
        <option>สายฝน 70×180</option>
        <option>สายฝน 100×200</option>
        <option>โมเดิร์น 80×200</option>
        <option>โมเดิร์น 80×180</option>
        <option>โมเดิร์น 90×200</option>
        <option>ขีดตรง 80×200</option>
        <option>ขีดบวก 80×200</option>
        <option>วงกบ 80×200</option>
        <option>วงกบกลม</option>
        <option>5ฟักปีกนก 90×200</option>
        <option>8ฟัก 90×200</option>
        <option>อื่นๆ</option>
      </select>
    </div>
    <div class="field">
      <label>ราคาเดิม (฿)</label>
      <input type="number" id="f-old" placeholder="0 = ราคาใหม่">
    </div>
    <div class="field">
      <label>ราคาใหม่ (฿)</label>
      <input type="number" id="f-new" placeholder="ราคาใหม่">
    </div>
  </div>
  <div class="field" style="margin-bottom:10px">
    <label>หมายเหตุ (ไม่บังคับ)</label>
    <input type="text" id="f-note" placeholder="เช่น ขึ้นราคาหลังผ่าน 30 review, เปิด SKU ใหม่">
  </div>
  <button class="btn-add" onclick="addEntry()">+ บันทึกการเปลี่ยนแปลง</button>
</div>

<!-- SUMMARY -->
<div class="summary-bar" id="summary"></div>

<!-- FILTER -->
<div class="filter-bar">
  <button class="btn active" onclick="filterShop('all',this)">ทั้งหมด</button>
  <button class="btn" onclick="filterShop('de',this)">De</button>
  <button class="btn" onclick="filterShop('tb',this)">Tb</button>
  <button class="btn" onclick="filterShop('chock',this)">chocksomkid</button>
  <button class="btn" onclick="filterShop('lam',this)">LAMTONMAISAK</button>
  <button class="btn" onclick="filterShop('mp',this)">ไม้พร้อม</button>
  <button class="btn" onclick="filterShop('other-all',this)">ร้านอื่น</button>
</div>

<div class="timeline-wrap" id="timeline"></div>

<script>
const SHOP_NAMES = {
  de:'De (DOOR_E_D)', tb:'Tb (turbo teak)', chock:'chocksomkid',
  lam:'LAMTONMAISAK', mp:'ไม้พร้อม', ojas:'ojas', cwd:'cwd',
  fh:'full house', pkd:'ประกายดาว', other:'อื่นๆ'
};

const SHOP_TAG = {
  de:'tag-shop-de', tb:'tag-shop-tb', chock:'tag-shop-chock',
  lam:'tag-shop-lam', mp:'tag-shop-other', ojas:'tag-shop-other',
  cwd:'tag-shop-other', fh:'tag-shop-other', pkd:'tag-shop-other', other:'tag-shop-other'
};

// Seed data from chat history
const SEED = [
  {id:'s1', date:'2026-05-22', shop:'de', sku:'สายฝน 80×200', old:1290, nw:1249, note:'ทดสอบ Experiment #1 — ปรับเพื่อแข่ง chocksomkid'},
  {id:'s2', date:'2026-05-29', shop:'de', sku:'วงกบกลม (ค่าส่ง)', old:240, nw:150, note:'Experiment #4 — ลดค่าส่ง ต้นทุนจริงต่ำกว่า'},
  {id:'s3', date:'2026-06-27', shop:'de', sku:'5ฟักปีกนก 90×200', old:0, nw:2890, note:'Experiment #2 — เปิด SKU ใหม่ ready stock'},
  {id:'s4', date:'2026-06-27', shop:'de', sku:'8ฟัก 90×200', old:0, nw:2890, note:'Experiment #2 — เปิด SKU ใหม่ ready stock'},
  {id:'s5', date:'2026-07-08', shop:'de', sku:'ประตู (น้ำหนัก/ค่าส่ง)', old:280, nw:250, note:'ลดน้ำหนัก 27→24 กก. ค่าส่งลด ฿30'},
  {id:'s6', date:'2026-07-10', shop:'de', sku:'สายฝน 90×200', old:0, nw:1449, note:'เปิด SKU ใหม่ — ถูกกว่าไม้พร้อม ฿51'},
  {id:'s7', date:'2026-07-26', shop:'tb', sku:'สายฝน 80×180', old:0, nw:1249, note:'เปิด SKU ใหม่'},
  {id:'s8', date:'2026-07-26', shop:'chock', sku:'สายฝน 70×180/70×200/80×180/80×200', old:1182, nw:1290, note:'chocksomkid ขึ้นราคาทุกไซซ์เล็ก +฿108'},
  {id:'s9', date:'2026-07-26', shop:'chock', sku:'สายฝน 90×200', old:1350, nw:1450, note:'chocksomkid ขึ้นราคา +฿100'},
  {id:'s10', date:'2026-07-26', shop:'chock', sku:'สายฝน 100×200', old:0, nw:1650, note:'chocksomkid เปิด SKU ใหม่'},
];

let currentFilter = 'all';

async function load(){
  try{
    const r = await window.storage.get('price-history');
    return r ? JSON.parse(r.value) : SEED;
  }catch(e){ return SEED; }
}

async function save(data){
  try{ await window.storage.set('price-history', JSON.stringify(data)); }catch(e){}
}

function entryType(entry){
  if(!entry.old || entry.old === 0) return 'new';
  return entry.nw > entry.old ? 'up' : 'down';
}

function diffText(entry){
  if(!entry.old || entry.old === 0) return {text:'เปิดใหม่', cls:'diff-new'};
  const d = entry.nw - entry.old;
  if(d > 0) return {text:`+฿${d.toLocaleString()}`, cls:'diff-up'};
  return {text:`-฿${Math.abs(d).toLocaleString()}`, cls:'diff-down'};
}

function renderSummary(data){
  const ups = data.filter(e=>entryType(e)==='up').length;
  const downs = data.filter(e=>entryType(e)==='down').length;
  const news = data.filter(e=>entryType(e)==='new').length;
  document.getElementById('summary').innerHTML = `
    <div class="sum-box"><div class="sum-num" style="color:var(--blue)">${data.length}</div><div class="sum-label">รายการทั้งหมด</div></div>
    <div class="sum-box"><div class="sum-num" style="color:var(--red)">${ups}</div><div class="sum-label">ราคาขึ้น</div></div>
    <div class="sum-box"><div class="sum-num" style="color:var(--green)">${downs}</div><div class="sum-label">ราคาลง</div></div>
    <div class="sum-box"><div class="sum-num" style="color:var(--blue)">${news}</div><div class="sum-label">เปิด SKU ใหม่</div></div>
  `;
}

function render(data, filter){
  const filtered = filter === 'all' ? data
    : filter === 'other-all' ? data.filter(e=>!['de','tb','chock','lam','mp'].includes(e.shop))
    : data.filter(e=>e.shop === filter);

  const sorted = [...filtered].sort((a,b)=>b.date.localeCompare(a.date));

  if(!sorted.length){
    document.getElementById('timeline').innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>';
    return;
  }

  document.getElementById('timeline').innerHTML = sorted.map(entry=>{
    const type = entryType(entry);
    const diff = diffText(entry);
    const shopTag = SHOP_TAG[entry.shop] || 'tag-shop-other';
    const shopName = SHOP_NAMES[entry.shop] || entry.shop;
    const priceOld = entry.old && entry.old > 0
      ? `<span class="price-old">฿${entry.old.toLocaleString()}</span><span class="arrow">→</span>` : '';
    const priceColor = type==='up'?'up':type==='down'?'down':'new';
    return `<div class="entry ${type}">
      <div class="entry-header">
        <div class="entry-meta">
          <span class="tag ${shopTag}">${shopName}</span>
          <span class="tag tag-sku">${entry.sku}</span>
          <span class="entry-date">${entry.date}</span>
        </div>
        <button class="btn-del" onclick="deleteEntry('${entry.id}')">ลบ</button>
      </div>
      <div class="price-change">
        ${priceOld}
        <span class="price-new ${priceColor}">฿${entry.nw.toLocaleString()}</span>
        <span class="diff-badge ${diff.cls}">${diff.text}</span>
      </div>
      ${entry.note ? `<div class="entry-note">📝 ${entry.note}</div>` : ''}
    </div>`;
  }).join('');
}

async function addEntry(){
  const shop = document.getElementById('f-shop').value;
  const sku = document.getElementById('f-sku').value;
  const oldP = parseInt(document.getElementById('f-old').value) || 0;
  const newP = parseInt(document.getElementById('f-new').value);
  const note = document.getElementById('f-note').value.trim();
  if(!newP){ alert('กรุณากรอกราคาใหม่'); return; }
  const data = await load();
  const entry = {
    id: 'e' + Date.now(),
    date: new Date().toISOString().split('T')[0],
    shop, sku, old: oldP, nw: newP, note
  };
  data.push(entry);
  await save(data);
  document.getElementById('f-old').value = '';
  document.getElementById('f-new').value = '';
  document.getElementById('f-note').value = '';
  renderSummary(data);
  render(data, currentFilter);
}

async function deleteEntry(id){
  if(!confirm('ลบรายการนี้?')) return;
  const data = await load();
  const filtered = data.filter(e=>e.id !== id);
  await save(filtered);
  renderSummary(filtered);
  render(filtered, currentFilter);
}

function filterShop(f, btn){
  currentFilter = f;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  load().then(data=>render(data, f));
}

// Init
load().then(data=>{
  renderSummary(data);
  render(data, 'all');
});
</script>
</body>
</html>
